<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分治法原理与时间复杂度推演</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
    .math { font-family: 'Times New Roman', Times, serif; font-style: italic; }
    .node-enter { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; transform: scale(0.5); }
    .edge-enter { animation: drawLine 0.6s ease-out forwards; stroke-dasharray: 200; stroke-dashoffset: 200; }
    @keyframes popIn { to { opacity: 1; transform: scale(1); } }
    @keyframes drawLine { to { stroke-dashoffset: 0; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 图标组件 ---
    const ArrowLeft = () => <svg className="w-4 h-4 mr-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>;
    const ArrowRight = () => <svg className="w-4 h-4 ml-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;
    const HomeIcon = () => <svg className="w-4 h-4 mr-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>;
    const Play = () => <svg className="w-5 h-5 mr-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
    const Refresh = () => <svg className="w-5 h-5 mr-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>;

    // 预定义树的坐标
    const treeNodes = [
      { id: 0, level: 0, x: 400, y: 60, label: "N", cost: "O(N)" },
      { id: 1, level: 1, x: 200, y: 160, label: "N/2", parentId: 0 },
      { id: 2, level: 1, x: 600, y: 160, label: "N/2", parentId: 0 },
      { id: 3, level: 2, x: 100, y: 260, label: "N/4", parentId: 1 },
      { id: 4, level: 2, x: 300, y: 260, label: "N/4", parentId: 1 },
      { id: 5, level: 2, x: 500, y: 260, label: "N/4", parentId: 2 },
      { id: 6, level: 2, x: 700, y: 260, label: "N/4", parentId: 2 },
      { id: 7, level: 3, x: 50, y: 360, label: "1", parentId: 3, isLeaf: true },
      { id: 8, level: 3, x: 150, y: 360, label: "1", parentId: 3, isLeaf: true },
      { id: 9, level: 3, x: 250, y: 360, label: "1", parentId: 4, isLeaf: true },
      { id: 10, level: 3, x: 350, y: 360, label: "1", parentId: 4, isLeaf: true },
      { id: 11, level: 3, x: 450, y: 360, label: "1", parentId: 5, isLeaf: true },
      { id: 12, level: 3, x: 550, y: 360, label: "1", parentId: 5, isLeaf: true },
      { id: 13, level: 3, x: 650, y: 360, label: "1", parentId: 6, isLeaf: true },
      { id: 14, level: 3, x: 750, y: 360, label: "1", parentId: 6, isLeaf: true },
    ];

    const stepMessages = [
      "阶段 0：问题初始状态，规模为 N。在最近点对中，寻找中位数分割线及合并跨界区域的开销为 O(N)。",
      "阶段 1：分 (Divide) —— 将问题等分为两个规模为 N/2 的子问题。本层合并总开销仍为 O(N)。",
      "阶段 2：继续递归划分，产生 4 个 N/4 的子问题。本层所有子问题合并的开销之和依然是 O(N)！",
      "阶段 3：治 (Conquer) —— 达到基础情形 (N≤3)，使用 O(1) 蛮力法直接求解。",
      "阶段 4：合 (Combine) —— 从底向上，每层累加。树的深度为 log(N)，每层开销 O(N)，总时间 O(N log N)！"
    ];

    function App() {
      const [step, setStep] = useState(0);
      const maxStep = 4;

      const handleNext = () => setStep(s => Math.min(maxStep, s + 1));
      const handleReset = () => setStep(0);

      const activeNodes = treeNodes.filter(n => n.level <= step);
      const activeEdges = activeNodes.filter(n => n.parentId !== undefined).map(n => {
        const parent = treeNodes.find(p => p.id === n.parentId);
        return { id: `e-${n.id}`, x1: parent.x, y1: parent.y + 20, x2: n.x, y2: n.y - 20 };
      });

      return (
        <div className="min-h-screen flex flex-col text-slate-800">
          <header className="bg-indigo-900 text-white py-4 px-6 shadow-md flex justify-between items-center z-10">
            <div>
              <h1 className="text-2xl font-bold tracking-tight">分治法：算法原理与时间复杂度推演</h1>
              <p className="text-indigo-200 text-sm mt-1">理论剖析 & 递归树动态可视化</p>
            </div>
            
            {/* 更新的导航按钮组 */}
            <div className="flex gap-2 sm:gap-3 flex-wrap">
              <a href="demo.html" className="flex items-center px-4 py-2 bg-indigo-800 hover:bg-indigo-700 rounded-lg transition-colors text-sm font-medium border border-indigo-600 shadow-sm text-indigo-100">
                <ArrowLeft /> 上一页 (算法演示)
              </a>
              <a href="pigeonhole.html" className="flex items-center px-4 py-2 bg-indigo-800 hover:bg-indigo-700 rounded-lg transition-colors text-sm font-medium border border-indigo-600 shadow-sm text-yellow-300 hover:text-yellow-200">
                下一页 (鸽巢原理) <ArrowRight />
              </a>
              <a href="index.html" className="flex items-center px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors text-sm font-medium border border-slate-700 text-white shadow-sm">
                <HomeIcon /> 返回主页
              </a>
            </div>
          </header>

          <main className="flex-grow p-6 flex flex-col xl:flex-row gap-6 max-w-7xl mx-auto w-full">
            <div className="flex-grow bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
              <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h2 className="font-bold text-slate-700 flex items-center">递归树 (Recursion Tree) 模型展示</h2>
                <div className="flex gap-2">
                  <button onClick={handleReset} className="px-3 py-1.5 text-sm flex items-center text-slate-600 bg-white border border-slate-300 rounded hover:bg-slate-100 transition">
                    <Refresh /> 重置
                  </button>
                  <button onClick={handleNext} disabled={step === maxStep} className={`px-4 py-1.5 text-sm flex items-center font-medium rounded transition ${step === maxStep ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm'}`}>
                    {step === maxStep ? '演示结束' : <><Play /> 下一步 ({step}/4)</>}
                  </button>
                </div>
              </div>
              
              <div className="relative flex-grow flex justify-center items-center bg-slate-50 p-4 overflow-x-auto h-[450px]">
                <svg width="800" height="420" className="overflow-visible">
                  {[0, 1, 2, 3].map(l => (
                    step >= l && (
                      <g key={`level-${l}`} className="node-enter" style={{ transformOrigin: '780px ' + (60 + l * 100) + 'px' }}>
                        <line x1="50" y1={60 + l * 100} x2="780" y2={60 + l * 100} stroke="#cbd5e1" strokeDasharray="5,5" />
                        <text x="790" y={65 + l * 100} fill="#ef4444" fontSize="16" fontWeight="bold" fontFamily="monospace">
                          {l === 3 ? "O(N)" : "O(N)"}
                        </text>
                      </g>
                    )
                  ))}
                  {activeEdges.map(edge => (
                    <line key={edge.id} x1={edge.x1} y1={edge.y1} x2={edge.x2} y2={edge.y2} stroke="#94a3b8" strokeWidth="2" className="edge-enter" />
                  ))}
                  {activeNodes.map(node => (
                    <g key={node.id} className="node-enter" style={{ transformOrigin: `${node.x}px ${node.y}px` }}>
                      <circle cx={node.x} cy={node.y} r={node.isLeaf ? 15 : 22} fill={node.isLeaf ? "#22c55e" : "#4f46e5"} stroke="#ffffff" strokeWidth="3" className="shadow-lg" />
                      <text x={node.x} y={node.y} textAnchor="middle" dominantBaseline="central" fill="white" fontSize={node.isLeaf ? "14" : "16"} fontWeight="bold" className="math">{node.label}</text>
                    </g>
                  ))}
                </svg>
              </div>

              <div className="bg-indigo-900 text-indigo-100 p-5 font-mono text-base border-t-4 border-indigo-500 min-h-[6rem] flex items-center">
                <span className="text-green-400 mr-2 font-bold animate-pulse">▶</span> 
                {stepMessages[step]}
              </div>
            </div>

            <div className="w-full xl:w-[450px] flex flex-col gap-5">
              <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 className="text-lg font-bold text-slate-800 mb-4 border-b pb-2 flex items-center">
                  <span className="bg-blue-100 text-blue-700 px-2 py-1 rounded text-sm mr-2">核心</span>最近点对：时间复杂度推导
                </h3>
                <div className="space-y-4 text-slate-600 text-sm leading-relaxed">
                  <p>假设共有 <span className="math">N</span> 个点，分治法解决该问题的时间耗费为 <span className="math">T(N)</span>。</p>
                  <div className="bg-slate-50 p-4 rounded-lg border border-slate-100">
                    <p className="font-bold text-slate-700 mb-2">1. 分 (Divide)：</p>
                    <p>找到中间分割线需要扫描。开销归入 <span className="math">O(N)</span>。</p>
                  </div>
                  <div className="bg-slate-50 p-4 rounded-lg border border-slate-100">
                    <p className="font-bold text-slate-700 mb-2">2. 治 (Conquer)：</p>
                    <p>左右两个子集分别递归求解。开销为 <b className="text-indigo-600">2 <span className="math">T(N/2)</span></b>。</p>
                  </div>
                  <div className="bg-yellow-50 p-4 rounded-lg border border-yellow-200">
                    <p className="font-bold text-yellow-800 mb-2">3. 合 (Combine) - 关键！</p>
                    <p>对于边界宽 <span className="math">2δ</span> 的条带，几何证明表明<b>每个点最多与对侧6个点计算距离</b>。</p>
                    <p className="mt-2 text-yellow-700">跨界扫描严格受限于线性规模：开销为 <b className="text-red-500 math">O(N)</b>。</p>
                  </div>
                </div>
              </div>

              <div className="bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-700 text-slate-300">
                <h3 className="text-lg font-bold text-white mb-4">主定理 (Master Theorem) 求解</h3>
                <div className="bg-slate-900 text-green-400 p-4 rounded text-center font-mono text-lg mb-4 shadow-inner">
                  T(N) = 2T(N/2) + O(N)
                </div>
                <p className="text-sm">
                  观察左侧递归树：<br/>
                  - 树的深度为 <span className="math">log<sub>2</sub>N</span><br/>
                  - 每层的总开销合并后都是 <span className="math"><b>O(N)</b></span>
                </p>
                <div className="mt-4 pt-4 border-t border-slate-600 text-center">
                  <span className="text-sm text-slate-400">将 log N 层的开销相加得出总复杂度：</span><br/>
                  <span className="text-2xl font-bold text-white math inline-block mt-2">O(N log N)</span>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
